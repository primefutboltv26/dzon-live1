<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DZON Live - En Directo</title>
  <style>
    :root {
      --bg: #090B10;
      --card: #121620;
      --accent: #FAEE1C;
      --cyan: #00F0FF;
      --text: #FFFFFF;
      --subtext: #8E9BAE;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
    
    header { background: #0d111a; border-bottom: 2px solid var(--accent); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 24px; font-weight: 900; color: var(--accent); text-transform: uppercase; font-style: italic; letter-spacing: 1px; }
    .logo span { color: var(--cyan); }
    .live-badge { background: #FF2E93; color: white; padding: 4px 12px; border-radius: 12px; font-weight: bold; font-size: 12px; text-transform: uppercase; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    main { display: grid; grid-template-columns: 1fr 340px; gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; width: 100%; flex: 1; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

    .player-container { background: black; border-radius: 12px; overflow: hidden; position: relative; aspect-ratio: 16/9; display: flex; justify-content: center; align-items: center; border: 1px solid #1f283d; }
    .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    .chat-section { background: var(--card); border-radius: 12px; border: 1px solid #1f283d; display: flex; flex-direction: column; height: 100%; min-height: 400px; }
    .chat-header { padding: 15px; border-bottom: 1px solid #1f283d; font-weight: bold; color: var(--cyan); }
    .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
    .chat-msg { background: #1a202c; padding: 8px 12px; border-radius: 8px; }
    .chat-msg .user { font-weight: bold; color: var(--accent); margin-right: 6px; }

    .chat-input-box { padding: 12px; border-top: 1px solid #1f283d; display: flex; gap: 8px; }
    .chat-input-box input { flex: 1; background: #0d111a; border: 1px solid #2a364f; border-radius: 6px; padding: 8px 12px; color: white; outline: none; }
    .chat-input-box button { background: var(--accent); border: none; font-weight: bold; padding: 8px 16px; border-radius: 6px; cursor: pointer; color: black; }
  </style>
</head>
<body>

  <header>
    <div class="logo">DZON <span>LIVE</span></div>
    <div class="live-badge">En Directo</div>
  </header>

  <main>
    <section class="player-container">
      <iframe src="https://vdo.ninja/?view=ch3K7UZ&autoplay=1&cleanoutput=1" allow="autoplay; camera; microphone; fullscreen; display-capture"></iframe>
    </section>

    <aside class="chat-section">
      <div class="chat-header">Chat de la Comunidad</div>
      <div class="chat-messages" id="chat">
        <div class="chat-msg"><span class="user">Moderador:</span>¡Bienvenidos al directo en DZON!</div>
      </div>
      <div class="chat-input-box">
        <input type="text" id="msgInput" placeholder="Escribe un mensaje...">
        <button onclick="sendMsg()">Enviar</button>
      </div>
    </aside>
  </main>

  <script>
    function sendMsg() {
      const input = document.getElementById('msgInput');
      const chat = document.getElementById('chat');
      if (input.value.trim() !== "") {
        const msg = document.createElement('div');
        msg.className = 'chat-msg';
        msg.innerHTML = `<span class="user">Espectador:</span>${input.value}`;
        chat.appendChild(msg);
        input.value = "";
        chat.scrollTop = chat.scrollHeight;
      }
    }
  </script>

</body>
</html>
